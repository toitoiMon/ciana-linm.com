<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "zh" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- if and .File (eq .File.ContentBaseName "about") }}
  {{ partial "footer.html" . }}
  {{- end }}
</body>
</html>
