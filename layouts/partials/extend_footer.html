<!-- Lightbox -->
<div id="lightbox" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.85); cursor:pointer; justify-content:center; align-items:center; overflow:auto;">
  <img id="lightbox-img" style="max-width:90vw; max-height:90vh; object-fit:contain; cursor:zoom-in;" />
  <button id="lb-prev" aria-label="Previous" style="position:fixed; left:16px; top:50%; transform:translateY(-50%); z-index:10000; background:rgba(255,255,255,0.15); border:none; color:rgba(255,255,255,0.6); font-size:28px; width:44px; height:44px; border-radius:50%; cursor:pointer; transition:background 0.2s, color 0.2s; line-height:1;">&lsaquo;</button>
  <button id="lb-next" aria-label="Next" style="position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:10000; background:rgba(255,255,255,0.15); border:none; color:rgba(255,255,255,0.6); font-size:28px; width:44px; height:44px; border-radius:50%; cursor:pointer; transition:background 0.2s, color 0.2s; line-height:1;">&rsaquo;</button>
</div>

<!-- Back to top button -->
<button id="back-to-top" aria-label="Back to top" style="
  display: none;
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 9998;
  width: 36px;
  height: 36px;
  border: 1px solid #999;
  border-radius: 50%;
  background: #fff;
  color: #999;
  font-family: var(--font-latin, 'Inter', sans-serif);
  font-size: 14px;
  font-weight: 300;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
  line-height: 1;
">&uarr;</button>

<script>
(function() {
  // Lightbox
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  var prevBtn = document.getElementById('lb-prev');
  var nextBtn = document.getElementById('lb-next');
  if (!lb || !lbImg) return;

  var imgs = Array.prototype.slice.call(document.querySelectorAll('.page-content img'));
  var currentIndex = -1;
  var zoomed = false;

  function resetZoom() {
    zoomed = false;
    lbImg.style.maxWidth = '90vw';
    lbImg.style.maxHeight = '90vh';
    lbImg.style.cursor = 'zoom-in';
    lb.style.overflow = 'auto';
    lb.style.justifyContent = 'center';
    lb.style.alignItems = 'center';
  }

  function showImage(index) {
    if (index < 0 || index >= imgs.length) return;
    currentIndex = index;
    lbImg.src = imgs[index].src;
    resetZoom();
    lb.style.display = 'flex';
    updateArrows();
  }

  function updateArrows() {
    if (prevBtn) prevBtn.style.display = currentIndex <= 0 ? 'none' : 'block';
    if (nextBtn) nextBtn.style.display = currentIndex >= imgs.length - 1 ? 'none' : 'block';
  }

  function closeLightbox() {
    lb.style.display = 'none';
    lbImg.src = '';
    currentIndex = -1;
    resetZoom();
  }

  imgs.forEach(function(img, i) {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      showImage(i);
    });
  });

  lbImg.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!zoomed) {
      zoomed = true;
      lbImg.style.maxWidth = '80%';
      lbImg.style.maxHeight = 'none';
      lbImg.style.cursor = 'zoom-out';
      lbImg.style.margin = 'auto';
      lb.style.justifyContent = 'center';
      lb.style.alignItems = 'center';
      // Scroll to center after image loads
      setTimeout(function() {
        lb.scrollLeft = (lb.scrollWidth - lb.clientWidth) / 2;
        lb.scrollTop = (lb.scrollHeight - lb.clientHeight) / 2;
      }, 50);
    } else {
      resetZoom();
    }
  });

  lb.addEventListener('click', function(e) {
    if (e.target === lb) closeLightbox();
  });

  if (prevBtn) {
    prevBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (currentIndex > 0) showImage(currentIndex - 1);
    });
    prevBtn.addEventListener('mouseenter', function() {
      prevBtn.style.background = 'rgba(255,255,255,0.35)';
      prevBtn.style.color = 'rgba(255,255,255,0.9)';
    });
    prevBtn.addEventListener('mouseleave', function() {
      prevBtn.style.background = 'rgba(255,255,255,0.15)';
      prevBtn.style.color = 'rgba(255,255,255,0.6)';
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (currentIndex < imgs.length - 1) showImage(currentIndex + 1);
    });
    nextBtn.addEventListener('mouseenter', function() {
      nextBtn.style.background = 'rgba(255,255,255,0.35)';
      nextBtn.style.color = 'rgba(255,255,255,0.9)';
    });
    nextBtn.addEventListener('mouseleave', function() {
      nextBtn.style.background = 'rgba(255,255,255,0.15)';
      nextBtn.style.color = 'rgba(255,255,255,0.6)';
    });
  }

  document.addEventListener('keydown', function(e) {
    if (lb.style.display !== 'flex') return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft' && currentIndex > 0) showImage(currentIndex - 1);
    if (e.key === 'ArrowRight' && currentIndex < imgs.length - 1) showImage(currentIndex + 1);
  });

  // Back to top
  var btn = document.getElementById('back-to-top');
  if (btn) {
    window.addEventListener('scroll', function() {
      btn.style.display = window.scrollY > 300 ? 'block' : 'none';
    });
    btn.addEventListener('mouseenter', function() {
      btn.style.color = '#000';
      btn.style.borderColor = '#000';
    });
    btn.addEventListener('mouseleave', function() {
      btn.style.color = '#999';
      btn.style.borderColor = '#999';
    });
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
})();
</script>
